<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#030712" />
<title>Perla Andina · Portal de Acceso</title>
<style>
:root{
  --bg-dark:#030712;
  --bg-card:rgba(10,15,30,.76);
  --border-cyan:#00f0ff;
  --border-cyan-dim:rgba(0,240,255,.25);
  --border-cyan-glow:rgba(0,240,255,.42);
  --text-main:#f3f4f6;
  --text-muted:#9ca3af;
  --text-cyan:#00f0ff;
  --purple:#7c3aed;
  --purple2:#4f46e5;
  --green:#10b981;
  --line:rgba(148,163,184,.18);
  --font:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --cyber:"Arial Narrow",Rajdhani,Inter,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:var(--font);background:var(--bg-dark);color:var(--text-main);overflow:hidden}
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(to right,rgba(0,240,255,.038) 1px,transparent 1px),linear-gradient(to bottom,rgba(0,240,255,.038) 1px,transparent 1px);background-size:40px 40px;animation:gridMove 35s linear infinite;pointer-events:none}
body::after{content:"";position:fixed;left:50%;top:50%;width:82vmax;height:82vmax;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(0,100,255,.09) 0%,rgba(0,240,255,.025) 40%,transparent 70%);pointer-events:none}
@keyframes gridMove{to{background-position:40px 40px}}
#portal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px;transition:opacity .35s ease,visibility .35s ease}
#portal.hide{opacity:0;visibility:hidden;pointer-events:none}
.access-card{width:min(440px,100%);position:relative;overflow:hidden;padding:38px 40px 32px;border:1px solid var(--border-cyan-dim);border-radius:13px;background:var(--bg-card);box-shadow:0 24px 70px rgba(0,0,0,.56),inset 0 0 26px rgba(0,240,255,.045);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.access-card::before{content:"";position:absolute;left:0;top:0;width:100%;height:3px;background:linear-gradient(90deg,transparent,var(--border-cyan),transparent)}
.corner{position:absolute;width:13px;height:13px;border:2px solid transparent;opacity:.9}.tl{top:10px;left:10px;border-top-color:var(--border-cyan);border-left-color:var(--border-cyan)}.tr{top:10px;right:10px;border-top-color:var(--border-cyan);border-right-color:var(--border-cyan)}.bl{bottom:10px;left:10px;border-bottom-color:var(--border-cyan);border-left-color:var(--border-cyan)}.br{bottom:10px;right:10px;border-bottom-color:var(--border-cyan);border-right-color:var(--border-cyan)}
.logo-area{text-align:center;margin-bottom:28px}.logo-img{width:76px;height:76px;object-fit:contain;border-radius:13px;filter:drop-shadow(0 0 14px rgba(0,240,255,.16))}.logo-title{margin:13px 0 0;font-family:var(--cyber);font-size:25px;font-weight:900;letter-spacing:2.3px;text-transform:uppercase}.logo-subtitle{margin-top:5px;color:var(--text-cyan);font-size:10px;font-weight:800;letter-spacing:3px;text-transform:uppercase;text-shadow:0 0 7px rgba(0,240,255,.3)}
.system-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:22px;color:#a7f3d0;font-size:9px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase}.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 9px var(--green);animation:pulse 1.5s ease-in-out infinite}@keyframes pulse{50%{opacity:.42;transform:scale(.82)}}
.portal-copy{margin:0 0 22px;text-align:center;color:var(--text-muted);font-size:12px;line-height:1.55}.portal-copy strong{color:#e5e7eb}
.cyber-btn{width:100%;min-height:48px;border:1px solid rgba(255,255,255,.1);border-radius:7px;background:linear-gradient(135deg,var(--purple),var(--purple2));color:white;font-family:var(--cyber);font-size:13px;font-weight:900;letter-spacing:2.4px;text-transform:uppercase;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 5px 18px rgba(124,58,237,.42);transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}.cyber-btn::before{content:"";position:absolute;top:0;left:-110%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);transition:left .5s ease}.cyber-btn:hover{transform:translateY(-2px);box-shadow:0 7px 24px rgba(124,58,237,.66);border-color:var(--border-cyan-glow)}.cyber-btn:hover::before{left:110%}.cyber-btn:active{transform:translateY(1px)}
.terminal{display:none;margin-top:18px;padding:11px 12px;min-height:74px;border:1px solid rgba(0,240,255,.13);border-radius:7px;background:#020617;color:var(--text-cyan);font:11px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;text-align:left;overflow:hidden}.terminal.show{display:block}.terminal-line{opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{margin-top:16px;text-align:center;color:#6b7280;font-size:9px;line-height:1.45;letter-spacing:.5px}
#appShell{position:fixed;inset:0;z-index:5;background:#fff;opacity:0;visibility:hidden;transition:opacity .35s ease}#appShell.show{opacity:1;visibility:visible}#appFrame{width:100%;height:100%;border:0;background:#fff}
#floatingPortalBtn{position:fixed;right:10px;bottom:10px;z-index:30;display:none;border:1px solid rgba(0,240,255,.28);border-radius:8px;background:rgba(3,7,18,.78);color:var(--text-cyan);padding:7px 9px;font:800 10px/1 var(--font);backdrop-filter:blur(10px);cursor:pointer}#appShell.show+#floatingPortalBtn{display:block}
@media(max-width:600px){.access-card{padding:30px 22px 25px}.logo-img{width:66px;height:66px}.logo-title{font-size:21px}.portal-copy{font-size:11px}#floatingPortalBtn{display:none!important}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

      <h1 class="logo-title" id="portalTitle">Perla Andina</h1>
      <div class="logo-subtitle">Portal de Sistemas</div>
    </div>
    <div class="system-row"><span class="dot"></span><span>Sistema operativo · V4.9.5</span></div>
    <p class="portal-copy"><strong>Acceso al sistema operativo Perla Andina.</strong><br>La autenticación real se mantiene dentro del aplicativo seguro.</p>
    <button type="button" class="cyber-btn" id="enterBtn">Ingresar al Terminal</button>
    <div class="terminal" id="terminal" aria-live="polite"></div>
    <div class="note">GitHub / Vercel → Google Apps Script · conexión segura al Web App</div>
  </main>
</div>

<section id="appShell" aria-label="Aplicación Perla Andina">
  <iframe
    id="appFrame"
    title="Perla Andina - Operaciones de turismo"
    src="about:blank"
    allow="clipboard-read; clipboard-write; fullscreen"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>
</section>
<button id="floatingPortalBtn" type="button" title="Volver al portal">Portal</button>

<script>
(function(){
  'use strict';
  const APP_URL='https://script.google.com/macros/s/AKfycbzqFoUQ_nC4uiXOZCLnGtOWofJbjydUlEFaO6aEoDmJUdzVM8Q8p3pfWo8Xveem08JKBw/exec';
  const portal=document.getElementById('portal');
  const shell=document.getElementById('appShell');
  const frame=document.getElementById('appFrame');
  const terminal=document.getElementById('terminal');
  const enter=document.getElementById('enterBtn');
  const portalBtn=document.getElementById('floatingPortalBtn');
  let started=false;

  function log(text){
    terminal.classList.add('show');
    const line=document.createElement('div');
    line.className='terminal-line';
    line.textContent='> '+text;
    terminal.appendChild(line);
  }
  function openApp(){
    if(started)return;
    started=true;
    enter.disabled=true;
    enter.textContent='CONECTANDO...';
    terminal.innerHTML='';
    log('INICIALIZANDO PORTAL SEGURO...');
    setTimeout(()=>log('CONECTANDO CON GOOGLE APPS SCRIPT...'),180);
    setTimeout(()=>{
      log('ABRIENDO PERLA ANDINA V4.9.0...');
      frame.src=APP_URL;
    },320);
  }
  frame.addEventListener('load',()=>{
    if(frame.src==='about:blank')return;
    log('SISTEMA CARGADO.');
    setTimeout(()=>{portal.classList.add('hide');shell.classList.add('show');},220);
  });
  enter.addEventListener('click',openApp);
  portalBtn.addEventListener('click',()=>{shell.classList.remove('show');portal.classList.remove('hide');enter.disabled=false;enter.textContent='Ingresar al Terminal';started=false;frame.src='about:blank';terminal.classList.remove('show');terminal.innerHTML='';});
})();
</script>
